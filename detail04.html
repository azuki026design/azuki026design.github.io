<!DOCTYPE html>
<html lang="ja">

  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <meta name="description" content="Azuki Design Portfolio｜作品詳細ページ">
    <meta property="og:site_name" content="Azuki Design Portfolio 詳細ページ">
    <meta property="og:title" content="Azuki Design Portfolio 詳細ページ">
    <meta property="og:description" content="Azuki Design Portfolio｜作品詳細ページ">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://dummy">
    <meta property="og:image" content="./assets/images/ogp.jpg">
    <meta property="og:locale" content="ja_JP">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100..900&display=swap" rel="stylesheet">
    <!-- ファビコン -->
    <link rel="icon" href="./assets/images/favicon.ico">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <!-- style.css -->
    <link rel="stylesheet" href="./assets/css/style.css">
  </head>

  <body>
    <main>
      <!-- ヘッダー -->
      <header class="header__detail">
        <div class="l-container">
          <nav class="c-breadcrumb">
            <a href="index.html#work" class="c-breadcrumb-link">作品一覧に戻る</a>
          </nav>
        </div>
      </header>
      <!-- 作品詳細 -->
      <section class="work__detail">
        <div class="l-container">
          <h1 class="work__detail-title">無添加洗剤のバナー</h1>
          <p class="work__detail-guide">原寸大バナーとサイズ違いのバリエーションをご覧になれます。</p>
          <div class="work__detail-img336x280">
            <img src="./assets/images/banner04x2.webp" alt="原寸大バナー" class="work__banner" loading="lazy" decoding="async">
          </div>
          <div class="l-container-narrow">
            <span class="work__caption">336×280 横長</span>
            <p class="work__comment">
              20代〜40代の女性をターゲットに、無添加洗剤のバナーとして制作しました。<br>
              赤ちゃんの肌にも優しい無添加洗剤と言う商品のブランド力を信頼感として、<br>
              割引セールや数量限定などの安売り感を排除して安心感を出しました。
            </p>
            <p class="work__comment">
              背景色もニュートラルカラーを使って上品で落ち着いた感じにしました。 </p>
          </div>
          <h2 class="work__detail-sub-title">Variation</h2>
          <p class="work__detail-guide">サイズ違いのバリエーションです。</p>
          <ul class="work__detail-list">
            <li class="work__detail-item">
              <span class="work__detail-item-title">1080×1080 正方形</span>
              <div class="work__detail-img1080x1080">
                <img src="./assets/images/banner04_1080x1080x2.webp" alt="1080×1080サイズのバナー" class="work__banner" loading="lazy" decoding="async">
              </div>
            </li>
          </ul>
      </section>
    </main>
    <footer class="footer">
      <div class="c-breadcrumb">
        <a href="index.html#work" class="c-breadcrumb-link">作品一覧に戻る</a>
      </div>
    </footer>
  </body>

</html>
